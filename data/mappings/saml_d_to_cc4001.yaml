# 11 rótulos não suspeitos do SAML-D (`Is_laundering = 0`). Não constam da tabela do SPEC.md §3.2 e não recebem
# enquadramento na CC 4.001/2020; ficam aqui para o loader aceitá-los sem inferir inciso por omissão e para o
# golden set do SPEC.md §8.3 (210 normais cobrindo as 11 tipologias normais).
