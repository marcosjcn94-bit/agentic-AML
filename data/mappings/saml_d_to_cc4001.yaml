# Mapeamento do projeto (NÃO é texto da norma) entre as tipologias do SAML-D e a Carta Circular BCB 4.001/2020.
# Fonte da tabela: SPEC.md §3.2. Critério de criticidade: indício de financiamento do terrorismo (art. 1º, IX),
# fragmentação para evitar controles (art. 1º, I e IV) ou ocultação em camadas.
#
# As chaves de `tipologias` são o rótulo EXATO da coluna de tipologia do SAML-D (`Layered_Fan_In`, `Single_large`,
# `Stacked Bipartite` com espaço); `typology` traz a grafia de exibição do enum `Typology` (DT-07). A diferença de
# grafia é dado versionado aqui, nunca conversão implícita em código (T0.6, Ask First).
#
# `article_ref` (dispositivos preferenciais) e `applicability` (texto curado) alimentam a seleção determinística de
# trechos do RF-06/ADR-013; ficam vazios (`[]` e `null`) até serem curados. A partir da mapping_version 2 (T1.8), a
# tipologia do alerta E2E (`Structuring`, lote3-brief.md Ask First) tem os dois campos preenchidos; as demais
# permanecem vazias até M4 — vazio explícito, nunca chave omitida.
# Mudança de enquadramento, de rótulo, de criticidade ou dos campos curados (article_ref/applicability) incrementa
# `mapping_version` (gravado em cada dossiê).
mapping_version: 2

fonte:
  referencia: "Carta Circular BCB 4.001, de 29 de janeiro de 2020, art. 1º"
  url: "https://www.bcb.gov.br/api/conteudo/app/normativos/exibenormativo?p1=Carta%20Circular&p2=4001"

aprovacao:
  por: marcosjcn94@gmail.com
  em: 2026-09-17
  situacao: provisorio
  referencia: >-
    T0.6 Ask First: chave pelo rótulo bruto do SAML-D e bloco `normais`; incisos e crítica conforme SPEC.md §3.2.
    T1.8 Ask First (lote3-brief.md): tipologia do alerta E2E = Structuring (golden set, T0.9); article_ref e
    applicability curados só para Structuring nesta versão (CC4001/art1/i1/d, /i1/e, /i1/k, /i4, pelo article_ref
    do chunker do T1.7); demais tipologias seguem vazias até M4.

# 17 rótulos suspeitos do SAML-D, na ordem da tabela do SPEC.md §3.2. As 6 primeiras são as críticas.
tipologias:
  Deposit-Send:
    typology: "Deposit-Send"
    incisos: ["IX"]          # financiamento do terrorismo
    alineas: []
    critica: true
    article_ref: []
    applicability: null

  Structuring:
    typology: "Structuring"
    incisos: ["I", "IV"]     # espécie — fragmentação de depósitos/saques
    alineas: ["d", "e", "k"]
    critica: true
    # article_ref no formato do chunker do T1.7 (Circ3978/CC4001 + art/inciso/alínea); conferidos contra o texto
    # oficial da CC 4.001/2020 baixado em T1.7 (alínea d = fragmentação de depósitos; e = fragmentação de saques;
    # k = saques fracionados abaixo do limite para dissimular o total; IV = movimentação de contas incompatível).
    article_ref: ["CC4001/art1/i1/d", "CC4001/art1/i1/e", "CC4001/art1/i1/k", "CC4001/art1/i4"]
    applicability: >-
      Fragmentação de depósitos, saques ou movimentações em espécie, ou de operações em conta, para dissimular o
      valor total ou driblar limites de comunicação de operações (CC 4.001/2020, art. 1º, I, alíneas d, e, k, e IV).

  Smurfing:
    typology: "Smurfing"
    incisos: ["I", "IV"]
    alineas: ["d", "e", "f", "l", "m"]
    critica: true
    article_ref: []
    applicability: null

  Layered_Fan_In:
    typology: "Layered Fan-In"
    incisos: ["IV"]          # movimentação de contas
    alineas: []
    critica: true
    article_ref: []
    applicability: null

  Layered_Fan_Out:
