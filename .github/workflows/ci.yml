name: ci

on:
  push:
  pull_request:

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: python -m playwright install --with-deps chromium
      - run: ruff check src tests scripts
      - run: pytest -q
      - run: python -m pip check
      - run: bandit -q -lll -r src
      # Mantido bloqueante: o projeto permanece No-Go enquanto os advisories
      # documentados em reports/security-final.md estiverem abertos.
      - run: pip-audit
