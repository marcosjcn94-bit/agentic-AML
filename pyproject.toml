[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "aml-guardian"
version = "0.1.0"
description = "Agentic AML & Regulatory Compliance Guardian (PoC)"
requires-python = ">=3.11"
# Stack obrigatória do SPEC.md §6. Proibido declarar openai, anthropic, boto3,
# google-cloud-* ou azure-* (guarda em tests/test_stack.py).
dependencies = [
    # Orquestração
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=2.0",
    # Gateway de modelos
    "litellm>=1.50",
    # Ferramentas de dados (SDK Python oficial)
    "mcp>=1.2",
    # Sanitização
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
    "spacy>=3.8,<3.9",
    "pt_core_news_lg @ https://github.com/explosion/spacy-models/releases/download/pt_core_news_lg-3.8.0/pt_core_news_lg-3.8.0-py3-none-any.whl",
    # Embeddings, base vetorial e cache
    "fastembed>=0.4",
    "chromadb>=0.5",
    # Extração de texto de PDF normativo (T1.7, RF-14) e BM25 para o desempate RRF (T1.8, RF-06) — ADR-015
    "pypdf>=5.0",
    "rank-bm25>=0.2",
    # Cifra do Vault
    # Presidio-anonymizer 2.2.364 ainda restringe cryptography a <49;
    # manter a faixa compatível evita quebrar pip check (RNF-07).
    "cryptography>=48.0.1,<49",
    # API, UI e templates
    "fastapi>=0.115",
    "pydantic>=2.8",
    "uvicorn>=0.30",
    "streamlit>=1.38",
    "jinja2>=3.1",
    # Loaders de configuração YAML
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "hypothesis>=6",
    "playwright>=1.47",
    "pytest-playwright>=0.5",
    "httpx>=0.27",
    "ruff>=0.6",
    "bandit>=1.7",
    "pip-audit>=2.7",
    # langfuse >=3 mudou o handler para langfuse.langchain.CallbackHandler (OTel-based),
    # que lê credenciais das env vars LANGFUSE_SECRET_KEY/LANGFUSE_HOST — sem exigir langchain<1.
    "langfuse>=4,<5",
    "langchain>=0.3",
    "langchain-text-splitters>=1.1.2",
]
# semgrep sem suporte nativo estável no Windows: instalar via WSL/Docker (RNF-07, M6).
security = [
    "semgrep>=1.85",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Testes sem marcador rodam offline; `-m ollama` ou `-m network` na linha de comando sobrepõe o filtro.
addopts = "-ra --strict-markers -m \"not ollama and not network\""
markers = [
    "ollama: exige modelo local carregado no Ollama",
    "network: exige download pela rede",
]

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# FastAPI Depends() em default de argumento é o padrão idiomático do framework (T1.11).
"src/aml_guardian/api/*.py" = ["B008"]
