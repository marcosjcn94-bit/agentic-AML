# Dias não úteis para o controle de prazo (SPEC.md RF-09): feriados de âmbito nacional + dias não úteis do mercado
# financeiro (Res. CMN 4.880/2020, art. 6º). Sábados e domingos não são listados: o cálculo de dia útil os trata à parte.
# Fontes conferidas no texto oficial em 2026-09-15 (Planalto e API de normativos do BCB).
# Sexta-feira da Paixão fica fora: não consta do art. 6º da Res. CMN 4.880/2020 e, em lei federal, é feriado religioso
# municipal (Lei 9.093/1995, art. 2º); incluí-la adiaria prazo_comunicacao sem base normativa.
# Período: 2022-2023 cobre o provável intervalo do SAML-D (confirmar na T0.6 com o CSV real); 2024-2027 cobre as
# decisões reais da PoC. Consulta fora do período falha no loader, nunca vira dia útil.
